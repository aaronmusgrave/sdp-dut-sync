jobs:
  find-ds-id:
    runs-on: ubuntu-latest
    steps:
      - name: Find servicedesk-perf data source ID
        env:
          DUST_API_KEY: ${{ secrets.DUST_API_KEY }}
        run: |
          curl -s \
            -H "Authorization: Bearer $DUST_API_KEY" \
            "https://dust.tt/api/v1/w/JrxWvNq5rb/spaces/vlt_CvSgrDxDZEQV/data_sources" \
            | python3 -m json.tool
