name: ServiceDesk Sync Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test 1 - Check file exists
        run: |
          echo "Test 1: Checking if script exists"
          ls -la scripts/
          echo ""
          if [ -f scripts/sync_servicedesk_intelligence.py ]; then
            echo "✓ Script found"
          else
            echo "❌ Script NOT found"
            exit 1
          fi

      - name: Test 2 - Try to run Python
        run: |
          echo "Test 2: Running Python script"
          python --version
          echo ""
          echo "Attempting to run script..."
          python scripts/sync_servicedesk_intelligence.py --help || echo "Script executed but may have failed"

      - name: Test 3 - Show what happened
        if: always()
        run: |
          echo "Test complete"
          ls -la
