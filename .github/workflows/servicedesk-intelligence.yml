name: ServiceDesk Intelligence Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force_full_sync:
        description: 'Force full sync'
        required: false
        type: boolean
        default: false

concurrency:
  group: servicedesk-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Restore checkpoint
        if: github.event.inputs.force_full_sync != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: sync-checkpoint

      - name: Delete checkpoint (force full sync)
        if: github.event.inputs.force_full_sync == 'true'
        run: rm -f sync_checkpoint.json

      - name: Run sync
        env:
          DUST_API_KEY: \${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: \${{ secrets.DUST_WORKSPACE_ID }}
          SDP_DOMAIN: \${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: \${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: \${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: \${{ secrets.SDP_REFRESH_TOKEN }}
          FORCE_FULL_SYNC: \${{ github.event.inputs.force_full_sync }}
        run: |
          echo "Starting sync..."
          echo "Force full sync: \$FORCE_FULL_SYNC"
          python scripts/sync_servicedesk_intelligence.py

      - name: Save checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-checkpoint
          path: sync_checkpoint.json
          retention-days: 30
          if-no-files-found: warn
