name: ServiceDesk Sync

on:
  schedule:
    - cron: '*/90 * * * *'
  workflow_dispatch:
    inputs:
      force_full_sync:
        description: 'Force full sync (ignore checkpoint)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # Delete checkpoint if force sync requested
      - name: Check for force full sync
        if: github.event.inputs.force_full_sync == true
        run: |
          echo "🔄 Force full sync requested - deleting checkpoints"
          rm -f sync_checkpoint.json
          rm -f last_cleanup.json
          echo "✓ Checkpoints deleted"

      - name: Run sync
        env:
          SDP_DOMAIN: \${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: \${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: \${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: \${{ secrets.SDP_REFRESH_TOKEN }}
          DUST_API_KEY: \${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: \${{ secrets.DUST_WORKSPACE_ID }}
          FORCE_FULL_SYNC: \${{ github.event.inputs.force_full_sync == true && 'true' || 'false' }}
        run: |
          echo "Running sync with FORCE_FULL_SYNC=\$FORCE_FULL_SYNC"
          python scripts/sync_servicedesk_intelligence.py

      - name: Commit changes
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --staged --quiet || git commit -m "Update sync checkpoint"
          git push || true
