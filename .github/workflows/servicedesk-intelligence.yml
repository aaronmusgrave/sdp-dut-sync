name: Sync ServiceDesk Intelligence

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours (more reliable than 90 min)
  workflow_dispatch:
    inputs:
      force_full_sync:
        description: 'Force full sync (ignore checkpoint)'
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # CORRECT: Use dawidd6/action-download-artifact for previous runs
      - name: Download checkpoint from previous run
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: sync-servicedesk-intelligence.yml
          name: sync-checkpoint
          path: .
          if_no_artifact_found: ignore
        continue-on-error: true
      
      - name: Check checkpoint status
        run: |
          echo "=== Checkpoint Status ==="
          if [ -f sync_checkpoint.json ]; then
            echo "✅ Checkpoint file found!"
            echo "Contents:"
            cat sync_checkpoint.json
            LAST_SYNC=\$(jq -r '.last_sync_timestamp' sync_checkpoint.json 2>/dev/null || echo "unknown")
            echo ""
            echo "Last sync: \$LAST_SYNC"
          else
            echo "⚠️ No checkpoint file found - will perform FULL SYNC"
          fi
          echo "========================="
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run sync script
        env:
          DUST_API_KEY: \${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: \${{ secrets.DUST_WORKSPACE_ID }}
          SDP_DOMAIN: \${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: \${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: \${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: \${{ secrets.SDP_REFRESH_TOKEN }}
          FORCE_FULL_SYNC: \${{ github.event.inputs.force_full_sync || 'false' }}
        run: |
          echo "🚀 Starting ServiceDesk Intelligence Sync..."
          python scripts/sync_servicedesk_intelligence.py
          SYNC_EXIT_CODE=\$?
          echo ""
          echo "Sync completed with exit code: \$SYNC_EXIT_CODE"
          exit \$SYNC_EXIT_CODE
      
      - name: Upload checkpoint for next run
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-checkpoint
          path: sync_checkpoint.json
          retention-days: 90
          if-no-files-found: warn
      
      - name: Sync Summary
        if: always()
        run: |
          echo ""
          echo "=== Sync Summary ==="
          if [ -f sync_checkpoint.json ]; then
            echo "✅ Checkpoint saved for next run"
            echo "Next sync will be incremental"
          else
            echo "⚠️ No checkpoint file created"
          fi
          echo "===================="
