name: Sync ServiceDesk Intelligence

on:
  schedule:
    - cron: '*/20 * * * *'  # Every 20 minutes (real-time mode)
  workflow_dispatch:
    inputs:
      force_full_sync:
        description: 'Force full sync (ignore checkpoint)'
        required: false
        type: boolean
        default: false
      force_archive_sync:
        description: 'Force archive sync only (without full sync)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 540   # 9 hours - required for full sync + 12,000+ archive tickets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for existing checkpoint
        run: |
          echo "=================================================="
          echo "REAL-TIME SYNC (Every 20 Minutes)"
          echo "=================================================="
          if [ -f sync_checkpoint.json ]; then
            echo "✓ Checkpoint found - incremental sync"
            echo "Last sync:"
            cat sync_checkpoint.json
          else
            echo "⚠ No checkpoint - full sync (first run)"
          fi
          echo "=================================================="

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            -r scripts/requirements.txt

      - name: Validate SharePoint sync files
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/sync_servicedesk_intelligence_sharepoint.py
          test -f scripts/upload_to_sharepoint.py
          echo "SharePoint sync files are present"

      - name: Run sync script
        env:
          SDP_DOMAIN: ${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: ${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: ${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: ${{ secrets.SDP_REFRESH_TOKEN }}
          SHAREPOINT_EXPORT_DIR: sharepoint_export
          FORCE_FULL_SYNC: ${{ github.event.inputs.force_full_sync || 'false' }}
          FORCE_ARCHIVE_SYNC: ${{ github.event.inputs.force_archive_sync || 'false' }}
        run: |
          echo "Starting ServiceDesk Intelligence Sync (SharePoint Export Mode)..."
          python scripts/sync_servicedesk_intelligence_sharepoint.py

      - name: Upload ticket exports to SharePoint
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_ROOT_FOLDER_ID: ${{ secrets.SHAREPOINT_ROOT_FOLDER_ID }}
        run: python scripts/upload_to_sharepoint.py --source-dir sharepoint_export --reconcile-active

      - name: Commit checkpoint to repository
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -f sync_checkpoint.json ]; then
            git add sync_checkpoint.json
            git diff --staged --quiet || git commit -m "Update sync checkpoint [skip ci] - $(date -u +"%Y-%m-%d %H:%M UTC")"
            git pull --rebase origin main
            git push
            echo "✓ Checkpoint committed to repository"
          else
            echo "⚠ No checkpoint file to commit"
          fi

      - name: Sync Summary
        if: always()
        run: |
          echo "=================================================="
          echo "SYNC SUMMARY (Real-Time Mode)"
          echo "=================================================="
          if [ "${{ job.status }}" = "success" ] && [ -f sync_checkpoint.json ]; then
            echo "✓ Checkpoint saved for this run"
            echo "Next sync: In 20 minutes"
            cat sync_checkpoint.json
          elif [ "${{ job.status }}" != "success" ]; then
            echo "❌ Sync failed; checkpoint was not committed"
          else
            echo "⚠ No checkpoint created"
          fi
          echo "=================================================="
