name: Sync ServiceDesk Intelligence

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:
    inputs:
      force_full_sync:
        description: 'Force full sync (ignore checkpoint)'
        required: false
        type: boolean
        default: false

# ADD THIS: Grant permissions to read workflow runs and artifacts
permissions:
  actions: read
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download checkpoint from previous run
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: sync-servicedesk-intelligence.yml
          name: sync-checkpoint
          path: .
          if_no_artifact_found: ignore
          github_token: \${{ secrets.GITHUB_TOKEN }}  # ADD THIS
        continue-on-error: true
      
      - name: Check checkpoint status
        run: |
          echo "Checkpoint Status Check"
          if [ -f sync_checkpoint.json ]; then
            echo "Checkpoint file found"
            cat sync_checkpoint.json
          else
            echo "No checkpoint file - will perform full sync"
          fi
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run sync script
        env:
          DUST_API_KEY: \${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: \${{ secrets.DUST_WORKSPACE_ID }}
          SDP_DOMAIN: \${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: \${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: \${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: \${{ secrets.SDP_REFRESH_TOKEN }}
          FORCE_FULL_SYNC: \${{ github.event.inputs.force_full_sync || 'false' }}
        run: |
          echo "Starting ServiceDesk Intelligence Sync..."
          python scripts/sync_servicedesk_intelligence.py
      
      - name: Upload checkpoint for next run
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-checkpoint
          path: sync_checkpoint.json
          retention-days: 90
          if-no-files-found: warn
      
      - name: Sync Summary
        if: always()
        run: |
          echo "Sync Summary"
          if [ -f sync_checkpoint.json ]; then
            echo "Checkpoint saved for next run"
            echo "Next sync will be incremental"
          else
            echo "No checkpoint file created"
          fi
