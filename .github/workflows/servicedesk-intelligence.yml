name: Export ServiceDesk Tickets to CSV

on:
  # Run weekly on Sunday at midnight
  schedule:
    - cron: '0 0 * * 0'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of days back to export'
        required: false
        default: '365'
      output_file:
        description: 'Output CSV filename'
        required: false
        default: 'servicedesk_export.csv'

jobs:
  export:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run CSV export
        env:
          SDP_DOMAIN: ${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: ${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: ${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: ${{ secrets.SDP_REFRESH_TOKEN }}
          EXPORT_DAYS_BACK: ${{ github.event.inputs.days_back || '365' }}
          OUTPUT_FILE: ${{ github.event.inputs.output_file || 'servicedesk_export.csv' }}
        run: python export_servicedesk_to_csv.py
      
      - name: Upload CSV as artifact
        uses: actions/upload-artifact@v4
        with:
          name: servicedesk-export-${{ github.run_number }}
          path: '*.csv'
          retention-days: 90
      
      - name: Get CSV info
        run: |
          echo "CSV File Info:"
          ls -lh *.csv
          echo ""
          echo "First 5 rows:"
          head -n 6 *.csv || true
