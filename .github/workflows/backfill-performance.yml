name: Backfill Performance Data v19.0.0

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: true
        type: string
      force:
        description: 'Force reprocess (ignore progress file)'
        required: false
        type: boolean
        default: false



      - name: Run backfill
        env:
          AZURE_TENANT_ID:      ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:      ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:  ${{ secrets.AZURE_CLIENT_SECRET }}
          SDP_DOMAIN:           ${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID:        ${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET:    ${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN:    ${{ secrets.SDP_REFRESH_TOKEN }}
          DUST_API_KEY:         ${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID:    ${{ secrets.DUST_WORKSPACE_ID }}
          DUST_SPACE_ID:        ${{ secrets.DUST_SPACE_ID }}
          DUST_DS_ID:           ${{ secrets.DUST_DS_ID }}
          DUST_TABLE_ID:        ${{ secrets.DUST_TABLE_ID }}
        run: python scripts/backfill_performance.py --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}"

      - name: Upload performance data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-data
          path: tech_performance_*.json
          retention-days: 30
