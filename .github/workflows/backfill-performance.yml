name: Backfill Performance Data v19.0.0

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: true
        type: string
      force:
        description: 'Force reprocess (ignore progress file)'
        required: false
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Delete progress file if force mode
        if: ${{ inputs.force == true }}
        run: rm -f backfill_progress.json

      - name: Run backfill
        env:
          AZURE_TENANT_ID:      ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:      ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:  ${{ secrets.AZURE_CLIENT_SECRET }}
          SDP_DOMAIN:           ${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID:        ${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET:    ${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN:    ${{ secrets.SDP_REFRESH_TOKEN }}
        run: python scripts/backfill_performance.py --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" --skip-csv

      - name: Upload performance snapshots to SharePoint
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_ROOT_FOLDER_ID: ${{ secrets.SHAREPOINT_ROOT_FOLDER_ID }}
        run: python scripts/upload_to_sharepoint.py --source-dir . --target-folder performance --glob 'tech_performance_*.json' --make-csv

      - name: Upload performance data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-data
          path: tech_performance_*.json
          retention-days: 30
