name: Backfill Historical Performance Data

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of days to backfill (max 365)'
        required: true
        default: '30'
        type: number

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: pip install requests
      
      - name: 📅 Run historical backfill
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          EMAIL_DOMAIN: ${{ secrets.EMAIL_DOMAIN }}
          SDP_DOMAIN: ${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: ${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: ${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: ${{ secrets.SDP_REFRESH_TOKEN }}
          DUST_API_KEY: ${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: ${{ secrets.DUST_WORKSPACE_ID }}
        run: |
          echo "🚀 Starting backfill for last ${{ inputs.days_back }} days"
          echo "⏱️ Estimated time: 15-20 minutes"
          python scripts/track_meeting_load.py --backfill ${{ inputs.days_back }}
      
      - name: 📁 Upload all performance reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-performance-${{ inputs.days_back }}days
          path: tech_performance_*.json
          retention-days: 90
      
      - name: 📁 Upload checkpoint if failed
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backfill-checkpoint
          path: backfill_checkpoint.json
      
      - name: 💾 Commit historical data to repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tech_performance_*.json
          git commit -m "📅 Historical backfill: ${{ inputs.days_back }} days" || echo "No changes"
          git push || echo "Nothing to push"
