name: Backfill Historical Performance Data

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of days to backfill (7, 30, 90, or 365)'
        required: true
        default: '365'
        type: choice
        options:
          - '7'
          - '30'
          - '90'
          - '180'
          - '365'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: pip install requests
      
      - name: 📅 Run historical backfill
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          EMAIL_DOMAIN: ${{ secrets.EMAIL_DOMAIN }}
          SDP_DOMAIN: ${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: ${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: ${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: ${{ secrets.SDP_REFRESH_TOKEN }}
          DUST_API_KEY: ${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: ${{ secrets.DUST_WORKSPACE_ID }}
        run: |
          echo "🚀 Starting backfill for last ${{ inputs.days_back }} days"
          echo "⏱️  Estimated time: ~$((inputs.days_back / 15)) minutes"
          python scripts/track_meeting_load.py --backfill ${{ inputs.days_back }}
