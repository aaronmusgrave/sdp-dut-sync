name: Daily Performance Data Snapshot

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to process (YYYY-MM-DD, leave empty for yesterday)'
        required: false
        type: string

jobs:
  collect-performance-snapshot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Calculate date to process
        id: calc-date
        run: |
          if [ -n "\${{ inputs.date }}" ]; then
            PROCESS_DATE="\${{ inputs.date }}"
          else
            PROCESS_DATE=\$(date -d "yesterday" +%Y-%m-%d)
          fi
          echo "date=\$PROCESS_DATE" >> \$GITHUB_OUTPUT
          echo "📸 Creating final snapshot for \$PROCESS_DATE"
      
      - name: Verify date was set
        run: |
          echo "Captured date: \${{ steps.calc-date.outputs.date }}"
          if [ -z "\${{ steps.calc-date.outputs.date }}" ]; then
            echo "ERROR: Date was not set properly"
            exit 1
          fi
      
      - name: Run performance data collection
        env:
          AZURE_TENANT_ID: \${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: \${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: \${{ secrets.AZURE_CLIENT_SECRET }}
          SDP_DOMAIN: \${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: \${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: \${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: \${{ secrets.SDP_REFRESH_TOKEN }}
          DUST_API_KEY: \${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: \${{ secrets.DUST_WORKSPACE_ID }}
          TARGET_DATE: \${{ steps.calc-date.outputs.date }}
        run: |
          echo "📸 Capturing final snapshot for yesterday..."
          echo "Target date: \$TARGET_DATE"
          python scripts/backfill_performance.py --start-date "\$TARGET_DATE" --end-date "\$TARGET_DATE"
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-snapshot-\${{ steps.calc-date.outputs.date }}
          path: tech_performance_*.json
          retention-days: 7
          if-no-files-found: warn
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Daily snapshot failed for \${{ steps.calc-date.outputs.date }}"
