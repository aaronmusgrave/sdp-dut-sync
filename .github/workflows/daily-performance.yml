name: Hourly Performance Data Update

on:
  schedule:
    - cron: '0 14-23 * * 1-5'
  workflow_dispatch:

jobs:
  update-current-performance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run performance data collection
        env:
          AZURE_TENANT_ID:      ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:      ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:  ${{ secrets.AZURE_CLIENT_SECRET }}
          SDP_DOMAIN:           ${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID:        ${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET:    ${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN:    ${{ secrets.SDP_REFRESH_TOKEN }}
        run: python scripts/backfill_performance.py --start-date $(date +%Y-%m-%d) --end-date $(date +%Y-%m-%d) --skip-csv

      - name: Upload performance snapshots to SharePoint
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_ROOT_FOLDER_ID: ${{ secrets.SHAREPOINT_ROOT_FOLDER_ID }}
        run: python scripts/upload_to_sharepoint.py --source-dir . --target-folder performance --glob 'tech_performance_*.json' --make-csv
