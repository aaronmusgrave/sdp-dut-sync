name: Debug Performance Script

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to test (YYYY-MM-DD)'
        required: true
        default: '2025-11-11'

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run diagnostic with debug output
        env:
          AZURE_TENANT_ID: \${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: \${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: \${{ secrets.AZURE_CLIENT_SECRET }}
          SDP_DOMAIN: \${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: \${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: \${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: \${{ secrets.SDP_REFRESH_TOKEN }}
          DUST_API_KEY: \${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: \${{ secrets.DUST_WORKSPACE_ID }}
          EMAIL_DOMAIN: \${{ secrets.EMAIL_DOMAIN }}
        run: |
          echo "================================"
          echo "Testing date: \${{ github.event.inputs.date }}"
          echo "================================"
          python scripts/track_meeting_load.py --date \${{ github.event.inputs.date }} --debug 2>&1 | tee debug_output.log
          EXIT_CODE=\$?
          echo ""
          echo "================================"
          echo "Exit code: \$EXIT_CODE"
          echo "================================"
          
      - name: Show last 100 lines of output
        if: always()
        run: |
          echo "Last 100 lines of debug output:"
          tail -100 debug_output.log || echo "No log file"
          
      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log-\${{ github.event.inputs.date }}
          path: debug_output.log
          retention-days: 7
          
      - name: Check if file was created
        if: always()
        run: |
          echo ""
          echo "================================"
          echo "Checking for generated files:"
          echo "================================"
          ls -lh tech_performance_*.json 2>/dev/null || echo "❌ No files created"
          echo ""
          if [ -f "tech_performance_\${{ github.event.inputs.date }}.json" ]; then
            echo "✅ File exists! First 20 lines:"
            head -20 "tech_performance_\${{ github.event.inputs.date }}.json"
          else
            echo "❌ File NOT created for \${{ github.event.inputs.date }}"
          fi
