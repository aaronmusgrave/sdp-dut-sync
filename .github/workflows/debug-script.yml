name: Debug Performance Script

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to test (YYYY-MM-DD)'
        required: true
        default: '2025-11-11'

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run diagnostic with debug output
        env:
          AZURE_TENANT_ID: \${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: \${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: \${{ secrets.AZURE_CLIENT_SECRET }}
          SDP_DOMAIN: \${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: \${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: \${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: \${{ secrets.SDP_REFRESH_TOKEN }}
          DUST_API_KEY: \${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: \${{ secrets.DUST_WORKSPACE_ID }}
          EMAIL_DOMAIN: \${{ secrets.EMAIL_DOMAIN }}
        run: |
          echo "Testing date: \${{ github.event.inputs.date }}"
          python scripts/track_meeting_load.py --date \${{ github.event.inputs.date }} --debug 2>&1 | tee debug_output.log
          echo "Exit code: \$?"
          
      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: debug-log
          path: debug_output.log
          
      - name: Check if file was created
        run: |
          ls -lh tech_performance_*.json || echo "No files created"
