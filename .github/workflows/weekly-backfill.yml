name: Weekly Performance Data Backfill

on:
  schedule:
    - cron: '0 13 * * 0'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD, leave empty for 7 days ago)'
        required: false
        default: ''
      end_date:
        description: 'End date (YYYY-MM-DD, leave empty for yesterday)'
        required: false
        default: ''

jobs:
  backfill-performance-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Get default start date
        id: default_start
        run: echo "value=$(date -d '7 days ago' +%Y-%m-%d)" >> \$GITHUB_OUTPUT
      
      - name: Get default end date
        id: default_end
        run: echo "value=$(date -d yesterday +%Y-%m-%d)" >> \$GITHUB_OUTPUT
      
      - name: Determine start date
        id: start
        env:
          INPUT_DATE: \${{ inputs.start_date }}
          DEFAULT_DATE: \${{ steps.default_start.outputs.value }}
        run: |
          echo "Input date: '\$INPUT_DATE'"
          echo "Default date: '\$DEFAULT_DATE'"
          if [ -z "\$INPUT_DATE" ]; then
            echo "value=\$DEFAULT_DATE" >> \$GITHUB_OUTPUT
            echo "Using default: \$DEFAULT_DATE"
          else
            echo "value=\$INPUT_DATE" >> \$GITHUB_OUTPUT
            echo "Using input: \$INPUT_DATE"
          fi
      
      - name: Determine end date
        id: end
        env:
          INPUT_DATE: \${{ inputs.end_date }}
          DEFAULT_DATE: \${{ steps.default_end.outputs.value }}
        run: |
          echo "Input date: '\$INPUT_DATE'"
          echo "Default date: '\$DEFAULT_DATE'"
          if [ -z "\$INPUT_DATE" ]; then
            echo "value=\$DEFAULT_DATE" >> \$GITHUB_OUTPUT
            echo "Using default: \$DEFAULT_DATE"
          else
            echo "value=\$INPUT_DATE" >> \$GITHUB_OUTPUT
            echo "Using input: \$INPUT_DATE"
          fi
      
      - name: Verify dates
        run: |
          echo "Start date from step output: \${{ steps.start.outputs.value }}"
          echo "End date from step output: \${{ steps.end.outputs.value }}"
      
      - name: Run performance data backfill
        env:
          AZURE_TENANT_ID: \${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: \${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: \${{ secrets.AZURE_CLIENT_SECRET }}
          SDP_DOMAIN: \${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: \${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: \${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: \${{ secrets.SDP_REFRESH_TOKEN }}
          DUST_API_KEY: \${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: \${{ secrets.DUST_WORKSPACE_ID }}
        run: |
          START_DATE="\${{ steps.start.outputs.value }}"
          END_DATE="\${{ steps.end.outputs.value }}"
          echo "About to run with START_DATE='\$START_DATE' END_DATE='\$END_DATE'"
          python scripts/backfill_performance.py --start-date "\$START_DATE" --end-date "\$END_DATE"
