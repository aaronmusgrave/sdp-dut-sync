name: Weekly Performance Data Backfill

on:
  schedule:
    - cron: '0 13 * * 0'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD, leave empty for last 7 days)'
        required: false
      end_date:
        description: 'End date (YYYY-MM-DD, leave empty for yesterday)'
        required: false

jobs:
  weekly-or-custom-backfill:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Determine dates
        id: dates
        run: |
          if [ "\${{ github.event_name }}" = "schedule" ]; then
            echo "start=$(date -d '7 days ago' +%Y-%m-%d)" >> \$GITHUB_OUTPUT
            echo "end=$(date -d yesterday +%Y-%m-%d)" >> \$GITHUB_OUTPUT
            echo "Using scheduled defaults: last 7 days"
          elif [ -z "\${{ inputs.start_date }}" ]; then
            echo "start=$(date -d '7 days ago' +%Y-%m-%d)" >> \$GITHUB_OUTPUT
            echo "end=$(date -d yesterday +%Y-%m-%d)" >> \$GITHUB_OUTPUT
            echo "No input provided, using defaults: last 7 days"
          else
            echo "start=\${{ inputs.start_date }}" >> \$GITHUB_OUTPUT
            echo "end=\${{ inputs.end_date }}" >> \$GITHUB_OUTPUT
            echo "Using provided dates: \${{ inputs.start_date }} to \${{ inputs.end_date }}"
          fi
      
      - name: Run performance data backfill
        env:
          AZURE_TENANT_ID: \${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: \${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: \${{ secrets.AZURE_CLIENT_SECRET }}
          SDP_DOMAIN: \${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: \${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: \${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: \${{ secrets.SDP_REFRESH_TOKEN }}
          DUST_API_KEY: \${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: \${{ secrets.DUST_WORKSPACE_ID }}
        run: python scripts/backfill_performance.py --start-date \${{ steps.dates.outputs.start }} --end-date \${{ steps.dates.outputs.end }}
