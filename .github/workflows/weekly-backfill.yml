name: Weekly Performance Data Backfill

on:
  schedule:
    - cron: '0 13 * * 0'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD, leave empty for last 7 days)'
        required: false
      end_date:
        description: 'End date (YYYY-MM-DD, leave empty for yesterday)'
        required: false

jobs:
  weekly-or-custom-backfill:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Determine dates
        id: dates
        env:
          EVENT_NAME: \${{ github.event_name }}
          INPUT_START: \${{ inputs.start_date }}
          INPUT_END: \${{ inputs.end_date }}
        run: |
          echo "Event name: \$EVENT_NAME"
          echo "Input start: '\$INPUT_START'"
          echo "Input end: '\$INPUT_END'"
          
          if [ "\$EVENT_NAME" = "schedule" ] || [ -z "\$INPUT_START" ]; then
            START=\$(date -d '7 days ago' +%Y-%m-%d)
            END=\$(date -d yesterday +%Y-%m-%d)
            echo "Using defaults: \$START to \$END"
          else
            START="\$INPUT_START"
            END="\$INPUT_END"
            echo "Using inputs: \$START to \$END"
          fi
          
          echo "start=\$START" >> \$GITHUB_OUTPUT
          echo "end=\$END" >> \$GITHUB_OUTPUT
      
      - name: Run performance data backfill
        env:
          AZURE_TENANT_ID: \${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: \${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: \${{ secrets.AZURE_CLIENT_SECRET }}
          SDP_DOMAIN: \${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: \${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: \${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: \${{ secrets.SDP_REFRESH_TOKEN }}
          DUST_API_KEY: \${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: \${{ secrets.DUST_WORKSPACE_ID }}
          START_DATE: \${{ steps.dates.outputs.start }}
          END_
