name: Weekly Performance Data Backfill

on:
  schedule:
    - cron: '0 13 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to backfill'
        required: false
        default: '7'

jobs:
  backfill-performance-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Get days input
        id: days
        run: |
          DAYS="\${{ inputs.days }}"
          if [ -z "\$DAYS" ]; then
            DAYS=7
          fi
          echo "value=\$DAYS" >> \$GITHUB_OUTPUT
      
      - name: Calculate start date
        id: start
        run: echo "value=$(date -d '\${{ steps.days.outputs.value }} days ago' +%Y-%m-%d)" >> \$GITHUB_OUTPUT
      
      - name: Calculate end date
        id: end
        run: echo "value=$(date -d yesterday +%Y-%m-%d)" >> \$GITHUB_OUTPUT
      
      - name: Verify dates
        run: |
          echo "Start: \${{ steps.start.outputs.value }}"
          echo "End: \${{ steps.end.outputs.value }}"
      
      - name: Run performance data backfill
        env:
          AZURE_TENANT_ID: \${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: \${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: \${{ secrets.AZURE_CLIENT_SECRET }}
          SDP_DOMAIN: \${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: \${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: \${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: \${{ secrets.SDP_REFRESH_TOKEN }}
          DUST_API_KEY: \${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: \${{ secrets.DUST_WORKSPACE_ID }}
        run: python scripts/backfill_performance.py --start-date \${{ steps.start.outputs.value }} --end-date \${{ steps.end.outputs.value }}
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-backfill-\${{ steps.end.outputs.value }}
          path: tech_performance_*.json
          retention-days: 7
          if-no-files-found: warn
