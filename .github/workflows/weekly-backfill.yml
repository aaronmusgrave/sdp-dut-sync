name: Weekly Performance Data Backfill

on:
  schedule:
    - cron: '0 13 * * 0'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD, leave empty for last 7 days)'
        required: false
      end_date:
        description: 'End date (YYYY-MM-DD, leave empty for yesterday)'
        required: false

jobs:
  weekly-or-custom-backfill:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Determine dates
        id: dates
        run: |
          echo "Event name: \${{ github.event_name }}"
          echo "Input start_date: '\${{ inputs.start_date }}'"
          echo "Input end_date: '\${{ inputs.end_date }}'"
          
          if [ "\${{ github.event_name }}" = "schedule" ]; then
            START=\$(date -d '7 days ago' +%Y-%m-%d)
            END=\$(date -d yesterday +%Y-%m-%d)
            echo "Using scheduled defaults"
          elif [ -z "\${{ inputs.start_date }}" ]; then
            START=\$(date -d '7 days ago' +%Y-%m-%d)
            END=\$(date -d yesterday +%Y-%m-%d)
            echo "No input, using defaults"
          else
            START="\${{ inputs.start_date }}"
            END="\${{ inputs.end_date }}"
            echo "Using provided inputs"
          fi
          
          echo "Calculated START: \$START"
          echo "Calculated END: \$END"
          echo "start=\$START" >> \$GITHUB_OUTPUT
          echo "end=\$END" >> \$GITHUB_OUTPUT
      
      - name: Verify outputs
        run: |
          echo "Step output start: '\${{ steps.dates.outputs.start }}'"
          echo "Step output end: '\${{ steps.dates.outputs.end }}'"
      
      - name: Run performance data backfill
        env:
          AZURE_TENANT_ID: \${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: \${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: \${{ secrets.AZURE_CLIENT_SECRET }}
          SDP_DOMAIN: \${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: \${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: \${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: \${{ secrets.SDP_REFRESH_TOKEN }}
          DUST_API_KEY: \${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: \${{ secrets.DUST_WORKSPACE_ID }}
        run: |
          START="\${{ steps.dates.outputs.start }}"
          END="\${{ steps.dates.outputs.end }}"
          echo "About to run with: START='\$START' END='\$END'"
          python scripts/backfill_performance.py --start-date "\$START" --end-date "\$END"
