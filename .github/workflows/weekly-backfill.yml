name: Weekly Performance Data Backfill

on:
  schedule:
    - cron: '0 13 * * 0'  # 7 AM CST Sundays
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD, leave empty for 7 days ago)'
        required: false
        default: ''
      end_date:
        description: 'End date (YYYY-MM-DD, leave empty for yesterday)'
        required: false
        default: ''

jobs:
  backfill-performance-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run performance data backfill
        env:
          AZURE_TENANT_ID: \${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: \${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: \${{ secrets.AZURE_CLIENT_SECRET }}
          SDP_DOMAIN: \${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: \${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: \${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: \${{ secrets.SDP_REFRESH_TOKEN }}
          DUST_API_KEY: \${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: \${{ secrets.DUST_WORKSPACE_ID }}
          INPUT_START: \${{ inputs.start_date }}
          INPUT_END: \${{ inputs.end_date }}
        run: |
          if [ -z "\$INPUT_START" ]; then
            START=\$(date -d '7 days ago' +%Y-%m-%d)
          else
            START="\$INPUT_START"
          fi
          if [ -z "\$INPUT_END" ]; then
            END=\$(date -d yesterday +%Y-%m-%d)
          else
            END="\$INPUT_END"
          fi
          python scripts/backfill_performance.py --start-date \$START --end-date \$END
