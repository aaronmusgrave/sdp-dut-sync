name: Weekly Performance Data Backfill

on:
  schedule:
    - cron: '0 13 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to backfill'
        required: false
        default: '7'
        type: string

jobs:
  backfill-performance-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Calculate date range
        id: calc-range
        run: |
          DAYS="\${{ inputs.days }}"
          if [ -z "\$DAYS" ]; then
            DAYS=7
          fi
          END_DATE=\$(date -d "yesterday" +%Y-%m-%d)
          START_DATE=$(date -d "\$DAYS days ago" +%Y-%m-%d)
          echo "start=\$START_DATE" >> \$GITHUB_OUTPUT
          echo "end=\$END_DATE" >> \$GITHUB_OUTPUT
          echo "Backfilling from \$START_DATE to \$END_DATE"
      
      - name: Verify dates were set
        run: |
          echo "Start date: \${{ steps.calc-range.outputs.start }}"
          echo "End date: \${{ steps.calc-range.outputs.end }}"
          if [ -z "\${{ steps.calc-range.outputs.start }}" ] || [ -z "\${{ steps.calc-range.outputs.end }}" ]; then
            echo "ERROR: Dates were not set properly"
            exit 1
          fi
      
      - name: Run performance data backfill
        env:
          AZURE_TENANT_ID: \${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: \${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: \${{ secrets.AZURE_CLIENT_SECRET }}
          SDP_DOMAIN: \${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: \${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: \${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: \${{ secrets.SDP_REFRESH_TOKEN }}
          DUST_API_KEY: \${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: \${{ secrets.DUST_WORKSPACE_ID }}
          START_DATE: \${{ steps.calc-range.outputs.start }}
          END_DATE: \${{ steps.calc-range.outputs.end }}
        run: |
          echo "Backfilling from \$START_DATE to \$END_DATE"
          python scripts/backfill_performance.py --start-date "\$START_DATE" --end-date "\$END_DATE"
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-backfill-\${{ steps.calc-range.outputs.end }}
          path: tech_performance_*.json
          retention-days: 7
          if-no-files-found: warn
