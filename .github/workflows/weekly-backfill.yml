name: Weekly Performance Data Backfill

on:
  schedule:
    - cron: '0 13 * * 0'  # 7 AM CST Sundays
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD, leave empty for 7 days ago)'
        required: false
        default: ''
      end_date:
        description: 'End date (YYYY-MM-DD, leave empty for yesterday)'
        required: false
        default: ''

jobs:
  backfill-performance-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Calculate start date
        id: start
        run: |
          if [ -n "\${{ inputs.start_date }}" ]; then
            echo "value=\${{ inputs.start_date }}" >> \$GITHUB_OUTPUT
          else
            echo "value=$(date -d '7 days ago' +%Y-%m-%d)" >> \$GITHUB_OUTPUT
          fi
      
      - name: Calculate end date
        id: end
        run: |
          if [ -n "\${{ inputs.end_date }}" ]; then
            echo "value=\${{ inputs.end_date }}" >> \$GITHUB_OUTPUT
          else
            echo "value=$(date -d yesterday +%Y-%m-%d)" >> \$GITHUB_OUTPUT
          fi
      
      - name: Run performance data backfill
        env:
          AZURE_TENANT_ID: \${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: \${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: \${{ secrets.AZURE_CLIENT_SECRET }}
          SDP_DOMAIN: \${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: \${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: \${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: \${{ secrets.SDP_REFRESH_TOKEN }}
          DUST_API_KEY: \${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: \${{ secrets.DUST_WORKSPACE_ID }}
        run: python scripts/backfill_performance.py --start-date "\${{ steps.start.outputs.value }}" --end-date "\${{ steps.end.outputs.value }}"
