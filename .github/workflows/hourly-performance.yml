name: Hourly Performance Data Update

on:
  schedule:
    - cron: '0 14-23 * * 1-5'
  workflow_dispatch:

jobs:
  update-current-performance:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Get current date and time
        id: datetime
        run: |
          CURRENT_DATE=\$(date +%Y-%m-%d)
          CURRENT_TIME=\$(date +%H-%M)
          echo "date=\$CURRENT_DATE" >> \$GITHUB_OUTPUT
          echo "time=\$CURRENT_TIME" >> \$GITHUB_OUTPUT
          echo "Date to process: \$CURRENT_DATE"
          echo "Time: \$CURRENT_TIME"
      
      - name: Verify date was set
        run: |
          echo "Captured date: \${{ steps.datetime.outputs.date }}"
          echo "Captured time: \${{ steps.datetime.outputs.time }}"
          if [ -z "\${{ steps.datetime.outputs.date }}" ]; then
            echo "ERROR: Date was not set properly"
            exit 1
          fi
      
      - name: Run performance data collection
        env:
          AZURE_TENANT_ID: \${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: \${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: \${{ secrets.AZURE_CLIENT_SECRET }}
          SDP_DOMAIN: \${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: \${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: \${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: \${{ secrets.SDP_REFRESH_TOKEN }}
          DUST_API_KEY: \${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: \${{ secrets.DUST_WORKSPACE_ID }}
          TARGET_DATE: \${{ steps.datetime.outputs.date }}
        run: |
          echo "🔄 Updating current day performance data..."
          echo "Target date: \$TARGET_DATE"
          python scripts/backfill_performance.py --start-date "\$TARGET_DATE" --end-date "\$TARGET_DATE"
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-hourly-\${{ steps.datetime.outputs.date }}-\${{ steps.datetime.outputs.time }}
          path: tech_performance_*.json
          retention-days: 2
          if-no-files-found: warn
      
      - name: Summary
        if: success()
        run: |
          echo "✅ Performance data updated for \${{ steps.datetime.outputs.date }}"
          echo "📊 Current day snapshot with real-time ticket counts"
