name: Hourly Performance Data Update

on:
  schedule:
    - cron: '0 14-23 * * 1-5'
  workflow_dispatch:

jobs:
  update-current-performance:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Get current date and time
        id: datetime
        shell: bash
        run: |
          echo "date=$(date +%Y-%m-%d)" >> \$GITHUB_OUTPUT
          echo "time=$(date +%H-%M)" >> \$GITHUB_OUTPUT
          echo "Updating performance data for $(date +%Y-%m-%d) at $(date +%H:%M)"
      
      - name: Run performance data collection
        env:
          AZURE_TENANT_ID: \${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: \${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: \${{ secrets.AZURE_CLIENT_SECRET }}
          SDP_DOMAIN: \${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: \${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: \${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: \${{ secrets.SDP_REFRESH_TOKEN }}
          DUST_API_KEY: \${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: \${{ secrets.DUST_WORKSPACE_ID }}
        shell: bash
        run: |
          echo "🔄 Updating current day performance data..."
          python scripts/backfill_performance.py \
            --start-date "\${{ steps.datetime.outputs.date }}" \
            --end-date "\${{ steps.datetime.outputs.date }}"
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-hourly-\${{ steps.datetime.outputs.date }}-\${{ steps.datetime.outputs.time }}
          path: tech_performance_*.json
          retention-days: 2
          if-no-files-found: warn
      
      - name: Summary
        if: success()
        shell: bash
        run: |
          echo "✅ Performance data updated for \${{ steps.datetime.outputs.date }}"
          echo "📊 Current day snapshot with real-time ticket counts"
