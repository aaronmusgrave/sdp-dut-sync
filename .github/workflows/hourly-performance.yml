name: Hourly Performance Data Update

on:
  schedule:
    - cron: '0 14-23 * * 1-5'
  workflow_dispatch:

jobs:
  update-current-performance:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Get today's date
        id: date
        run: echo "today=$(date +%Y-%m-%d)" >> \$GITHUB_OUTPUT
      
      - name: Get current time  
        id: time
        run: echo "now=$(date +%H-%M)" >> \$GITHUB_OUTPUT
      
      - name: Verify outputs
        run: |
          echo "Date captured: \${{ steps.date.outputs.today }}"
          echo "Time captured: \${{ steps.time.outputs.now }}"
          if [ -z "\${{ steps.date.outputs.today }}" ]; then
            echo "ERROR: Date not captured"
            exit 1
          fi
      
      - name: Run performance data collection
        env:
          AZURE_TENANT_ID: \${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: \${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: \${{ secrets.AZURE_CLIENT_SECRET }}
          SDP_DOMAIN: \${{ secrets.SDP_DOMAIN }}
          SDP_CLIENT_ID: \${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: \${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: \${{ secrets.SDP_REFRESH_TOKEN }}
          DUST_API_KEY: \${{ secrets.DUST_API_KEY }}
          DUST_WORKSPACE_ID: \${{ secrets.DUST_WORKSPACE_ID }}
        run: python scripts/backfill_performance.py --start-date "\${{ steps.date.outputs.today }}" --end-date "\${{ steps.date.outputs.today }}"
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-hourly-\${{ steps.date.outputs.today }}-\${{ steps.time.outputs.now }}
          path: tech_performance_*.json
          retention-days: 2
          if-no-files-found: warn
